<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Card — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    .wifi-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      margin-top: 16px;
    }

    .tool-header, .wifi-editor, .wifi-preview {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .tool-header { animation-delay: 0.05s; }
    .wifi-editor { animation-delay: 0.1s; }
    .wifi-preview { animation-delay: 0.15s; }

    @media (max-width: 750px) {
      .wifi-layout { grid-template-columns: 1fr; }
    }

    .editor-section {
      margin-bottom: 20px;
    }

    .editor-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 8px;
    }

    .wifi-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
    }

    .wifi-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 12px 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text2);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .preset-btn.active {
      background: var(--accent);
      color: var(--btn-text);
      border-color: var(--accent);
    }

    .color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border2);
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.15s;
    }

    .color-btn:hover {
      transform: scale(1.1);
    }

    .color-btn.active {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    .preview-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: sticky;
      top: 80px;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .preview-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .canvas-wrap {
      background: repeating-conic-gradient(#33333366 0% 25%, transparent 0% 50%) 0 0/16px 16px;
      border-radius: var(--radius-xs);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    #wifiCanvas {
      max-width: 100%;
      display: block;
    }

    .export-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(232, 255, 71, 0.1);
      border: 1px solid var(--accent);
      border-radius: var(--radius-xs);
      font-size: 0.75rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
<nav class="nav">
  <span class="nav-title">WiFi Card</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
</nav>

<div class="tool-page">
  <div class="tool-header">
    <h1>WiFi Card</h1>
    <p>Create WiFi QR codes for easy network sharing. Export as PNG.</p>
  </div>

  <div class="wifi-layout">
    <div class="wifi-editor">
      <div class="editor-section">
        <p class="editor-label">Network Name (SSID)</p>
        <input type="text" class="wifi-input" id="ssid" placeholder="WiFi Network Name" value="MyWiFi" />
      </div>

      <div class="editor-section">
        <p class="editor-label">Password</p>
        <input type="text" class="wifi-input" id="password" placeholder="WiFi Password" value="password123" />
      </div>

      <div class="editor-section">
        <p class="editor-label">Security Type</p>
        <div class="preset-grid">
          <button class="preset-btn security-btn active" data-security="WPA">WPA</button>
          <button class="preset-btn security-btn" data-security="WEP">WEP</button>
          <button class="preset-btn security-btn" data-security="nopass">Open</button>
        </div>
      </div>

      <div class="editor-section">
        <p class="editor-label">Theme</p>
        <div class="color-grid" id="bgColors">
          <button class="color-btn active" style="background:#0a0a0f" data-bg="#0a0a0f"></button>
          <button class="color-btn" style="background:#1a1a2e" data-bg="#1a1a2e"></button>
          <button class="color-btn" style="background:#16213e" data-bg="#16213e"></button>
          <button class="color-btn" style="background:#1f4037" data-bg="#1f4037"></button>
          <button class="color-btn" style="background:#faf8f5" data-bg="#faf8f5"></button>
          <button class="color-btn" style="background:#ffffff" data-bg="#ffffff"></button>
        </div>
      </div>

      <div class="editor-section">
        <p class="editor-label">Accent Color</p>
        <div class="color-grid" id="accentColors">
          <button class="color-btn active" style="background:#e8ff47" data-accent="#e8ff47"></button>
          <button class="color-btn" style="background:#48dbfb" data-accent="#48dbfb"></button>
          <button class="color-btn" style="background:#1dd1a1" data-accent="#1dd1a1"></button>
          <button class="color-btn" style="background:#ff6b6b" data-accent="#ff6b6b"></button>
          <button class="color-btn" style="background:#ff9f43" data-accent="#ff9f43"></button>
          <button class="color-btn" style="background:#5f27cd" data-accent="#5f27cd"></button>
        </div>
      </div>

      <div class="info-row">
        <span>📶</span>
        <span>Scan QR code to connect instantly</span>
      </div>
    </div>

    <div class="wifi-preview">
      <div class="preview-card">
        <div class="preview-header">
          <span class="preview-title">Preview</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="wifiCanvas"></canvas>
        </div>
        <div class="export-btns">
          <button class="btn btn-primary" id="downloadPngBtn">⬇ Download PNG</button>
        </div>
      </div>
    </div>
  </div>
</div>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Deck — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    .nav-x-icon { color: var(--text2); font-size: 1rem; }

    /* ── Deck layout ── */
    .deck-container {
      display: flex; overflow-x: auto;
      height: calc(100vh - 57px);
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg);
    }
    .deck-column {
      flex: 1 1 0; min-width: 240px; max-width: 400px;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg2); overflow: hidden;
    }
    .deck-col-header {
      position: sticky; top: 0;
      padding: 14px 16px; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      z-index: 2; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .col-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      margin-right: 10px; object-fit: cover;
      background: var(--bg3); flex-shrink: 0;
    }
    .deck-col-header h2 {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.95rem; color: var(--accent);
    }
    .deck-col-header .handle {
      font-size: 0.72rem; color: var(--text3); margin-top: 2px;
    }
    .deck-col-badge {
      font-size: 0.7rem; padding: 2px 8px;
      background: var(--bg3); border-radius: 100px; color: var(--text2);
      display: flex; align-items: center; gap: 4px;
    }
    .deck-pulse {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    .deck-col-feed {
      flex: 1; overflow-y: auto; padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg);
    }
    .deck-loading {
      padding: 24px 16px; text-align: center;
      font-size: 0.8rem; color: var(--text3);
    }

    /* ── Tweet card ── */
    .tweet-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px;
      margin-bottom: 10px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .tweet-card:hover { background: var(--card-hover); border-color: var(--border2); }

    .tweet-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .tweet-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg3); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; border: 1px solid var(--border2); color: var(--text3);
      object-fit: cover;
    }
    .tweet-handle { font-size: 0.78rem; color: var(--text3); }
    .tweet-date {
      font-size: 0.7rem; color: var(--text3);
      margin-left: auto; white-space: nowrap;
    }

    .tweet-text {
      font-size: 0.88rem; color: var(--text);
      line-height: 1.5; margin-bottom: 10px;
      word-break: break-word; white-space: pre-wrap;
    }
    .tweet-text a { color: var(--accent); text-decoration: none; }
    .tweet-text a:hover { text-decoration: underline; }

    /* Media */
    .tweet-img {
      width: 100%; border-radius: 8px;
      aspect-ratio: 16/9; object-fit: cover;
      background: var(--bg3); display: block; margin-bottom: 10px;
    }
    .tweet-img.full {
      aspect-ratio: auto;
      max-height: 400px; object-fit: contain;
    }
    .tweet-img-grid {
      display: grid; gap: 3px; margin-bottom: 10px;
      border-radius: 8px; overflow: hidden;
    }
    .tweet-img-grid.count-2 { grid-template-columns: 1fr 1fr; }
    .tweet-img-grid.count-3 { grid-template-columns: 1fr 1fr; }
    .tweet-img-grid.count-3 .grid-img:first-child { grid-row: span 2; }
    .tweet-img-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover;
      display: block; background: var(--bg3);
    }

    /* Video placeholder */
    .tweet-video-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: 8px;
      background: var(--bg3); display: flex; align-items: center;
      justify-content: center; margin-bottom: 10px;
      border: 1px solid var(--border2); position: relative; overflow: hidden;
    }
    .video-thumb {
      position: absolute; width: 100%; height: 100%; object-fit: cover;
      z-index: 1;
    }
    .play-btn-icon {
      position: relative; z-index: 2;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(0,0,0,0.6); display: flex;
      align-items: center; justify-content: center;
      font-size: 1.2rem; border: 2px solid rgba(255,255,255,0.5);
    }

    /* Tags row */
    .tweet-tags {
      display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .tweet-tag {
      font-size: 0.65rem; padding: 2px 7px;
      border-radius: 100px; font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
      border: 1px solid;
    }
    .tag-video   { color: #ff6b6b; border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
    .tag-image   { color: var(--accent2); border-color: rgba(124,107,255,0.4); background: rgba(124,107,255,0.08); }
    .tag-images  { color: var(--accent2); border-color: rgba(124,107,255,0.4); background: rgba(124,107,255,0.08); }
    .tag-link    { color: var(--accent); border-color: rgba(232,255,71,0.3); background: rgba(232,255,71,0.06); }
    .tag-retweet { color: var(--text2); border-color: var(--border2); background: var(--bg3); }

    /* Action buttons */
    .tweet-btns {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px;
    }
    .tweet-btn {
      font-size: 0.68rem; padding: 4px 9px;
      border: 1px solid var(--border2); border-radius: var(--radius-xs);
      background: var(--bg3); color: var(--text2); cursor: pointer;
      transition: all 0.15s; font-family: 'DM Sans', sans-serif;
    }
    .tweet-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .tweet-btn.copied { background: var(--accent); color: var(--btn-text); border-color: var(--accent); }
    .tweet-btn.open-x { color: var(--text3); }

    /* Engagement stats */
    .tweet-stats {
      display: flex; gap: 12px; margin-top: 8px;
      padding-top: 8px; border-top: 1px solid var(--border);
    }
    .tweet-stat {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.72rem; color: var(--text3);
    }
    .tweet-stat .stat-icon { font-size: 0.8rem; }
    .tweet-stat .stat-count { font-weight: 500; }
    .stat-likes .stat-icon { color: #ff6b6b; }
    .stat-retweets .stat-icon { color: #4ade80; }
    .stat-replies .stat-icon { color: var(--accent2); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px; backdrop-filter: blur(5px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--radius); max-width: 620px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 24px;
      position: relative; scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg);
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: var(--bg3); border: 1px solid var(--border2);
      color: var(--text2); width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { color: var(--text); border-color: var(--accent); }
    .modal-tweet-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-right: 40px;
    }
    .modal-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg3); display: flex; align-items: center;
      justify-content: center; font-size: 1.3rem;
      border: 1px solid var(--border2); color: var(--text3); flex-shrink: 0;
      object-fit: cover;
    }
    .modal-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; }
    .modal-handle { font-size: 0.8rem; color: var(--text3); }
    .modal-text {
      font-size: 0.95rem; line-height: 1.6;
      color: var(--text); margin-bottom: 14px; word-break: break-word;
      white-space: pre-wrap;
    }
    .modal-text a { color: var(--accent); }
    .modal-media-grid {
      display: grid; gap: 4px; margin-bottom: 14px;
      border-radius: 10px; overflow: hidden;
    }
    .modal-media-grid.count-1 { grid-template-columns: 1fr; }
    .modal-media-grid.count-2 { grid-template-columns: 1fr 1fr; }
    .modal-media-grid.count-3 { grid-template-columns: 1fr 1fr; }
    .modal-media-grid.count-3 img:first-child { grid-row: span 2; }
    .modal-media-grid.count-4 { grid-template-columns: 1fr 1fr; }
    .modal-media-grid img { width: 100%; object-fit: contain; aspect-ratio: auto; max-height: 80vh; display: block; }
    .modal-media-grid.count-1 img { aspect-ratio: 16/9; }
    .modal-footer {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; border-top: 1px solid var(--border);
      padding-top: 14px; margin-top: 4px;
    }
    .modal-date { font-size: 0.78rem; color: var(--text3); flex: 1; }
    .modal-stats {
      display: flex; gap: 14px; margin-bottom: 12px;
      padding: 8px 0; border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .modal-stat {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text2);
    }
    .modal-stat .stat-icon { font-size: 0.9rem; }
    .modal-stat .stat-count { font-weight: 600; }
    .modal-open-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: var(--radius-xs);
      background: var(--btn-bg); color: var(--btn-text);
      font-size: 0.78rem; font-weight: 600; text-decoration: none;
      transition: opacity 0.2s;
    }
    .modal-open-btn:hover { opacity: 0.85; }
    .modal-copy-btn {
      padding: 7px 14px; border-radius: var(--radius-xs);
      border: 1px solid var(--border2); background: var(--bg3);
      color: var(--text2); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .modal-copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .modal-copy-btn.copied { background: var(--accent); color: var(--btn-text); border-color: var(--accent); }
    .modal-video-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: 10px;
      background: var(--bg3); margin-bottom: 14px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; position: relative;
    }
    .modal-video-thumb {
      position: absolute; width: 100%; height: 100%; object-fit: cover;
    }

    .deck-col-header, .deck-column, .tweet-card {
      opacity: 0; transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .deck-column:nth-of-type(1) { animation-delay: 0.1s; }
    .deck-column:nth-of-type(2) { animation-delay: 0.15s; }
    .deck-column:nth-of-type(3) { animation-delay: 0.2s; }
    .deck-column:nth-of-type(4) { animation-delay: 0.25s; }
    .deck-column:nth-of-type(5) { animation-delay: 0.3s; }

    /* ════════════════════════════════════════
       MOBILE — TAB-BASED SINGLE COLUMN VIEW
    ════════════════════════════════════════ */

    /* Tab bar — hidden on desktop */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: var(--bg2);
      border-top: 1px solid var(--border2);
      z-index: 90;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      align-items: stretch;
    }
    .mobile-tab-bar::-webkit-scrollbar { display: none; }

    .mobile-tab {
      flex: 0 0 auto;
      min-width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 10px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .mobile-tab:hover { background: var(--bg3); }
    .mobile-tab.active { border-bottom-color: var(--accent); }

    .mobile-tab-initial {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--bg3); border: 1.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.6rem; color: var(--accent2);
      transition: border-color 0.15s;
      flex-shrink: 0; overflow: hidden; position: relative;
    }
    .mobile-tab.active .mobile-tab-initial { border-color: var(--accent); color: var(--accent); }
    .mobile-tab-initial img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%; display: none;
    }
    .mobile-tab-initial img.loaded { display: block; }

    .mobile-tab-label {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.52rem; color: var(--text3);
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 72px;
      transition: color 0.15s;
    }
    .mobile-tab.active .mobile-tab-label { color: var(--accent); }

    @keyframes slideInFromRight { from { transform: translateX(28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    @keyframes slideInFromLeft  { from { transform: translateX(-28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    .deck-column.slide-from-right { animation: slideInFromRight 0.22s cubic-bezier(0.4,0,0.2,1) forwards; }
    .deck-column.slide-from-left  { animation: slideInFromLeft  0.22s cubic-bezier(0.4,0,0.2,1) forwards; }

    @media (max-width: 700px) {

      /* Kill the fadeUp re-trigger when columns are shown/hidden via mobile-active */
      .deck-column {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .nav { padding: 10px 14px; gap: 8px; }
      .nav-back { padding: 5px 9px; font-size: 0.78rem; }
      .nav-title { font-size: 0.88rem; }
      .nav-x-icon { display: none; }
      .theme-toggle { width: 32px; height: 32px; }

      .mobile-tab-bar { display: flex; }

      .deck-container {
        display: block;
        height: calc(100vh - 53px);
        overflow: hidden;
        position: relative;
      }
      .deck-column {
        position: absolute; inset: 0;
        min-width: unset; max-width: unset; width: 100%;
        border-right: none;
        display: none; flex-direction: column;
        padding-bottom: 52px;
      }
      .deck-column.mobile-active { display: flex; }
      .deck-col-feed { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

      .deck-col-header { padding: 10px 14px; }
      .col-avatar { width: 26px; height: 26px; margin-right: 8px; }
      .deck-col-header h2 { font-size: 0.88rem; }
      .deck-col-header .handle { font-size: 0.67rem; }

      .tweet-card { padding: 11px; }
      .tweet-text { font-size: 0.84rem; }
      .tweet-btn  { font-size: 0.64rem; padding: 3px 7px; }

      /* Modal: bottom sheet */
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal-box {
        max-width: 100%; width: 100%;
        max-height: 92vh;
        border-radius: var(--radius) var(--radius) 0 0;
        padding: 20px 18px 28px;
      }
      .modal-footer { flex-wrap: wrap; gap: 8px; }
      .modal-open-btn { flex: 1; justify-content: center; text-align: center; }
      .modal-copy-btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">𝕏 Deck</span>
    <span class="nav-x-icon" style="font-size:0.75rem;color:var(--text3);">via nitter</span>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
      <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    </div>
  </nav>

  <div class="deck-container" id="deckContainer"></div>

  <!-- Mobile tab bar -->
  <div class="mobile-tab-bar" id="mobileTabBar"></div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>



</body>
</html>

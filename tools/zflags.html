<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dual Flag Generator — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    /* ── page-specific only ─────────────────────────────────────────────── */

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }
    .controls-grid, .search-row, .field, .btn, .flag-preview {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .controls-grid { animation-delay: 0.05s; }
    .search-row:nth-of-type(1) { animation-delay: 0.1s; }
    .search-row:nth-of-type(2) { animation-delay: 0.15s; }
    .field:nth-of-type(1) { animation-delay: 0.2s; }
    .field:nth-of-type(2) { animation-delay: 0.25s; }
    .btn { animation-delay: 0.3s; }

    @media (max-width: 560px) {
      .controls-grid { grid-template-columns: 1fr; }
      .divider-col   { display: none; }
    }

    .divider-col {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      color: var(--text3);
      font-size: 18px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .flag-col .field {
      margin-bottom: 0;
    }

    .flag-search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    /* Compact search button — not full-width like global .btn */
    .btn-search {
      flex-shrink: 0;
      padding: 12px 14px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-search:hover  { border-color: var(--accent); color: var(--accent); }
    .btn-search:active { transform: scale(0.98); }
    .btn-search:disabled { opacity: 0.35; cursor: default; transform: none; }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      z-index: 200;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      max-height: 220px;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      font-size: 0.85rem;
      color: var(--text2);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .suggestion-item:hover { background: var(--bg3); color: var(--text); }
    .suggestion-item img {
      width: 34px;
      height: 21px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid var(--border2);
      flex-shrink: 0;
    }

    /* Flag preview chip */
    .flag-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      min-height: 22px;
      font-size: 0.78rem;
      color: var(--text3);
    }
    .flag-preview.loaded { color: var(--text2); }
    .flag-preview img {
      width: 34px;
      height: 21px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid var(--border2);
    }

    /* ── Zoom controls ───────────────────────────────────────────────────── */
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .zoom-label {
      font-size: 0.75rem;
      color: var(--text3);
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
      min-width: 42px;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
    }
    .zoom-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .zoom-btn:active { transform: scale(0.92); }

    .zoom-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--border2);
      outline: none;
      cursor: pointer;
    }
    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, #7c6af7);
      border: 2px solid var(--bg2);
      cursor: pointer;
      box-shadow: 0 0 0 1px var(--accent, #7c6af7);
    }
    .zoom-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, #7c6af7);
      border: 2px solid var(--bg2);
      cursor: pointer;
    }

    .zoom-reset {
      font-size: 0.72rem;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .zoom-reset:hover { color: var(--accent); }

    /* ── Position controls ──────────────────────────────────────────────────── */
    .pos-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px 8px;
      margin-top: 8px;
    }

    .pos-axis-label {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      width: 12px;
      text-align: center;
    }

    .pos-val {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      min-width: 36px;
      text-align: right;
    }

    .pos-reset {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      text-align: left;
      transition: color 0.15s;
      margin-top: 2px;
    }
    .pos-reset:hover { color: var(--accent); }

    /* re-use zoom-slider for position sliders */

    /* Download row */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .sync-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text3);
      cursor: pointer;
      user-select: none;
      margin-left: auto;
    }
    .sync-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Override global .btn full-width for this context */
    #dlBtn {
      width: auto;
      margin-bottom: 0;
    }

    .status {
      font-size: 0.8rem;
      color: var(--text3);
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">Dual Flag Generator</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-page">

    <div class="tool-header">
      <h1>Dual Flag Generator</h1>
      <p>Search two flags — outputs a 1920×1080 PNG with HD flags from Wikipedia.</p>
    </div>

    <div class="controls-grid">

      <div class="flag-col">
        <div class="field">
          <label>Left flag</label>
          <div class="search-row">
            <div class="flag-search-wrap" id="wrapL">
              <input type="text" id="inputL" placeholder="Morocco, France, Brazil…" autocomplete="off" />
              <div class="suggestions" id="sugL" style="display:none;"></div>
            </div>
            <button class="btn-search" id="btnL">Search</button>
          </div>
        </div>
        <div class="flag-preview" id="previewL">—</div>
        <!-- Zoom controls for left flag -->
        <div class="zoom-row" id="zoomRowL">
          <span class="zoom-label" id="zoomLabelL">100%</span>
          <button class="zoom-btn" id="zoomOutL" title="Zoom out">−</button>
          <input type="range" class="zoom-slider" id="sliderL" min="50" max="300" value="100" step="1" />
          <button class="zoom-btn" id="zoomInL" title="Zoom in">+</button>
          <button class="zoom-reset" id="zoomResetL">Reset zoom</button>
        </div>
        <!-- Position controls for left flag -->
        <div class="pos-grid" id="posGridL">
          <span class="pos-axis-label">X</span>
          <input type="range" class="zoom-slider" id="posXL" min="-100" max="100" value="0" step="1" />
          <span class="pos-val" id="posXLabelL">0%</span>
          <span class="pos-axis-label">Y</span>
          <input type="range" class="zoom-slider" id="posYL" min="-100" max="100" value="0" step="1" />
          <span class="pos-val" id="posYLabelL">0%</span>
          <button class="pos-reset" id="posResetL">Reset position</button>
        </div>
      </div>

      <div class="divider-col">⇄</div>

      <div class="flag-col">
        <div class="field">
          <label>Right flag</label>
          <div class="search-row">
            <div class="flag-search-wrap" id="wrapR">
              <input type="text" id="inputR" placeholder="Honduras, Germany, Japan…" autocomplete="off" />
              <div class="suggestions" id="sugR" style="display:none;"></div>
            </div>
            <button class="btn-search" id="btnR">Search</button>
          </div>
        </div>
        <div class="flag-preview" id="previewR">—</div>
        <!-- Zoom controls for right flag -->
        <div class="zoom-row" id="zoomRowR">
          <span class="zoom-label" id="zoomLabelR">100%</span>
          <button class="zoom-btn" id="zoomOutR" title="Zoom out">−</button>
          <input type="range" class="zoom-slider" id="sliderR" min="50" max="300" value="100" step="1" />
          <button class="zoom-btn" id="zoomInR" title="Zoom in">+</button>
          <button class="zoom-reset" id="zoomResetR">Reset zoom</button>
        </div>
        <!-- Position controls for right flag -->
        <div class="pos-grid" id="posGridR">
          <span class="pos-axis-label">X</span>
          <input type="range" class="zoom-slider" id="posXR" min="-100" max="100" value="0" step="1" />
          <span class="pos-val" id="posXLabelR">0%</span>
          <span class="pos-axis-label">Y</span>
          <input type="range" class="zoom-slider" id="posYR" min="-100" max="100" value="0" step="1" />
          <span class="pos-val" id="posYLabelR">0%</span>
          <button class="pos-reset" id="posResetR">Reset position</button>
        </div>
      </div>

    </div>

    <div class="notice" id="statusNotice">
      Search and select two flags to generate the image.
    </div>

    <div class="bottom-row">
      <button class="btn btn-primary" id="dlBtn" disabled>↓ Download 1920×1080 PNG</button>
      <span class="status" id="status"></span>
      <label class="sync-toggle">
        <input type="checkbox" id="syncToggle">
        <span>Sync zoom & position</span>
      </label>
    </div>

    <div class="canvas-wrap">
      <canvas id="cv" width="1920" height="1080"></canvas>
    </div>

  </div>

  
</body>
</html>

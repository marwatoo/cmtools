<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Annotator — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    .annotator-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 16px;
    }
    .canvas-area {
      position: relative;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #annotatorCanvas { max-width: 100%; display: block; cursor: crosshair; }
    .canvas-area.empty { cursor: default; min-height: 60vh; }
    .canvas-area.empty #annotatorCanvas { display: none; }
    .tools-bar {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .tools-bar .tool-group { display: flex; flex-direction: column; gap: 8px; }
    .tools-bar .tool-group-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
    }
    @media (max-width: 850px) {
      .tools-bar { flex-direction: column; align-items: stretch; }
    }
    .editor-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .editor-section { margin-bottom: 20px; }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .tool-btn.active-select { border-color: #28c840; background: rgba(40, 200, 64, 0.1); color: #28c840; }
    .annotation-highlight {
      position: absolute;
      border: 2px solid #e8ff47;
      pointer-events: none;
      z-index: 5;
      border-radius: 4px;
    }
    .tool-btn {
      padding: 12px 6px;
      background: var(--bg2);
      border: 2px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--text); }
    .tool-btn.active { border-color: var(--accent); background: var(--card-hover); color: var(--accent); }
    .tool-btn .tool-icon { display: block; font-size: 1.3rem; margin-bottom: 3px; }
    .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .color-swatch {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.15s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .field-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .field-row .field { flex: 1; margin-bottom: 0; }
    .field input, .field select {
      width: 100%; padding: 10px 12px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-xs); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select { cursor: pointer; }
    .drop-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 40px; text-align: center;
    }
    .drop-overlay .dz-icon { font-size: 2.5rem; color: var(--accent); opacity: 0.6; }
    .drop-overlay .dz-text { font-size: 0.95rem; color: var(--text2); }
    .drop-overlay .dz-sub { font-size: 0.8rem; color: var(--text3); }
    .drop-overlay input { display: none; }
    .tools-bar .action-btns { display: flex; flex-direction: column; gap: 6px; }
    .action-btns { display: flex; flex-direction: column; gap: 8px; }
    .undo-btn {
      width: 100%; padding: 10px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-xs); color: var(--text2);
      font-family: 'DM Sans', sans-serif; font-weight: 600;
      font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
      margin-bottom: 8px;
    }
    .undo-btn:hover { border-color: var(--accent); color: var(--accent); }
    .text-input-overlay {
      position: absolute;
      background: var(--bg2);
      border: 2px solid var(--accent);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      padding: 6px 10px;
      outline: none;
      z-index: 10;
      min-width: 120px;
    }
    .number-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 4px;
    }
  </style>
</head>
<body>
<nav class="nav">
  <span class="nav-title">Screenshot Annotator</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
</nav>

<div class="tool-page">
  <div class="tool-header">
    <h1>Screenshot Annotator</h1>
    <p>Draw arrows, rectangles, circles, blur areas, and add numbered labels on screenshots. Export as PNG.</p>
  </div>

  <div class="annotator-layout">
    <div class="canvas-area empty" id="canvasArea">
      <canvas id="annotatorCanvas"></canvas>
      <div class="drop-overlay" id="dropOverlay">
        <div class="dz-icon">⧉</div>
        <div class="dz-text">Drop a screenshot here or click to upload</div>
        <div class="dz-sub">JPG, PNG, WebP</div>
        <input type="file" id="imageInput" accept="image/*" />
      </div>
    </div>

    <div class="tools-bar">
      <div class="tool-group">
        <span class="tool-group-label">Drawing Tools</span>
        <div class="tool-grid" id="toolGrid">
          <button class="tool-btn active" data-tool="arrow">
            <span class="tool-icon">➤</span>Arrow
          </button>
          <button class="tool-btn" data-tool="rect">
            <span class="tool-icon">▭</span>Rect
          </button>
          <button class="tool-btn" data-tool="circle">
            <span class="tool-icon">◯</span>Circle
          </button>
          <button class="tool-btn" data-tool="line">
            <span class="tool-icon">╱</span>Line
          </button>
          <button class="tool-btn" data-tool="blur">
            <span class="tool-icon">▒</span>Blur
          </button>
            <button class="tool-btn" data-tool="label">
              <span class="tool-icon">①</span>Label
            </button>
            <button class="tool-btn" data-tool="text">
              <span class="tool-icon">Aa</span>Text
            </button>
            <button class="tool-btn" data-tool="select">
              <span class="tool-icon">⊹</span>Select
            </button>
          </div>
      </div>

      <div class="tool-group">
        <span class="tool-group-label">Stroke Color</span>
        <div class="color-row" id="strokeColors"></div>
      </div>

      <div class="tool-group">
        <span class="tool-group-label">Options</span>
        <div class="field-row">
          <div class="field">
            <label>Line Width</label>
            <select id="lineWidth">
              <option value="2">Thin</option>
              <option value="4" selected>Medium</option>
              <option value="8">Thick</option>
              <option value="12">Extra Thick</option>
            </select>
          </div>
          <div class="field">
            <label>Opacity</label>
            <select id="lineOpacity">
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1" selected>100%</option>
            </select>
          </div>
        </div>
      </div>

      <div class="tool-group">
        <span class="tool-group-label">Actions</span>
        <button class="undo-btn" id="undoBtn">↩ Undo Last</button>
        <button class="undo-btn" id="clearBtn">✕ Clear All</button>
        <div class="action-btns">
          <button class="btn btn-primary" id="downloadPngBtn">⬇ PNG</button>
          <button class="btn btn-secondary" id="downloadJpgBtn">⬇ JPG</button>
        </div>
      </div>
    </div>
  </div>
</div>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiFlag — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    .tool-wrap {
      max-width: 640px; margin: 0 auto; padding: 32px 24px;
    }
    .search-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .search-row input {
      flex: 1; height: 44px; padding: 0 14px;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s;
    }
    .search-row input::placeholder { color: var(--text3); }
    .search-row input:focus { border-color: var(--accent); }
    .search-btn {
      height: 44px; padding: 0 20px;
      background: var(--accent); color: var(--btn-text);
      border: none; border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif; font-size: 0.78rem;
      font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; cursor: pointer;
      transition: opacity 0.2s;
    }
    .search-btn:hover { opacity: 0.88; }
    .search-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .suggestions {
      position: relative; margin-bottom: 20px;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); box-shadow: var(--shadow);
      overflow: hidden; display: none;
    }
    .suggestions.visible { display: block; }
    .suggestion-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--card-hover); }
    .suggestion-item img {
      width: 48px; height: 32px; object-fit: cover;
      border-radius: 4px; border: 1px solid var(--border);
      flex-shrink: 0; background: var(--bg3);
    }
    .suggestion-item span {
      font-size: 0.88rem; font-weight: 500; color: var(--text);
    }

    .preview-area {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      margin-bottom: 16px; display: none;
    }
    .preview-area.visible { display: block; }
    .preview-inner {
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; max-height: 320px; background: #000;
      position: relative;
    }
    .preview-inner img {
      max-width: 100%; max-height: 320px;
      object-fit: contain; display: block;
    }
    .preview-info {
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border);
    }
    .preview-label {
      font-size: 0.78rem; color: var(--text2); font-weight: 500;
    }
    .preview-label small {
      display: block; font-size: 0.65rem; color: var(--text3);
    }

    .action-row {
      display: flex; gap: 10px;
    }
    .action-btn {
      flex: 1; padding: 12px 16px;
      border: 1px solid var(--border2); border-radius: var(--radius-sm);
      background: var(--bg2); color: var(--text2);
      font-family: 'Syne', sans-serif; font-size: 0.82rem;
      font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary {
      background: var(--accent); color: var(--btn-text);
      border-color: var(--accent);
    }
    .action-btn.primary:hover { opacity: 0.88; color: var(--btn-text); }
    .action-btn:disabled { opacity: 0.32; cursor: not-allowed; }

    .status-msg {
      padding: 12px 16px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.84rem; color: var(--text2);
      margin-bottom: 16px; display: none;
    }
    .status-msg.visible { display: block; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text3); font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    canvas { display: none; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">WikiFlag</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-wrap">
    <div class="search-row">
      <input type="text" id="flagSearch" placeholder="Search for a flag (e.g. Morocco, Japan, Brazil…)" autocomplete="off">
      <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="suggestions" id="suggestions"></div>

    <div class="status-msg" id="statusMsg"></div>

    <div id="emptyState" class="empty-state">
      <div class="icon">🏳️</div>
      <div>Search for a country flag on Wikipedia</div>
    </div>

    <div class="preview-area" id="previewArea">
      <div class="preview-inner">
        <img id="previewImg" src="" alt="">
      </div>
      <div class="preview-info">
        <div class="preview-label" id="previewLabel">
          <span id="flagName">—</span>
          <small id="flagRes">—</small>
        </div>
      </div>
    </div>

    <div class="action-row" id="actionRow" style="display:none;">
      <button class="action-btn primary" id="dlBtn">↓ Download PNG</button>
      <button class="action-btn" id="copyBtn">Copy to Clipboard</button>
    </div>

    <canvas id="exportCanvas"></canvas>
  </div>

  
</body>
</html>

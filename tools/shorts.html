<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shorts Tracker — MediaTools Studio</title>
    <link rel="preconnect" href="https://api.allorigins.win">
    <link rel="preconnect" href="https://corsproxy.io">
    <link rel="preconnect" href="https://api.codetabs.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    
    <link rel="stylesheet" href="../assets/global.css">
    <style>
        :root {
            --yt-red: #ff0000;
        }
        [data-theme="light"] {
            --yt-red: #cc0000;
        }

        .page-wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .toolbar-info {
            flex: 1;
            min-width: 200px;
        }
        .toolbar-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }
        .toolbar-subtitle {
            font-size: 0.8rem;
            color: var(--text3);
            margin-top: 2px;
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 14px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .toolbar-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .toolbar-btn:disabled:hover {
            border-color: var(--border2);
            color: var(--text2);
        }
        .toolbar-btn.primary {
            background: var(--yt-red);
            color: #fff;
            border-color: var(--yt-red);
        }
        .toolbar-btn.primary:hover {
            opacity: 0.88;
            color: #fff;
        }

        .channel-section {
            margin-bottom: 26px;
        }
        .channel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .channel-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .channel-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .channel-handle {
            font-size: 0.75rem;
            color: var(--text3);
        }
        .channel-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text2);
            background: var(--bg3);
            padding: 2px 9px;
            border-radius: 100px;
        }
        .channel-warning {
            font-size: 0.72rem;
            color: var(--accent3, #ff6b6b);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .shorts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .short-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
            transition: background 0.2s, border-color 0.2s;
        }
        .short-row:hover {
            background: var(--card-hover);
            border-color: var(--border2);
        }

        .short-thumb-wrap {
            width: 64px;
            height: 114px;
            flex-shrink: 0;
            border-radius: 8px;
            background: var(--bg3);
            overflow: hidden;
            position: relative;
        }
        .short-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .short-info {
            flex: 1;
            min-width: 0;
        }
        .short-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.35;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .short-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .short-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.74rem;
            color: var(--text3);
        }
        .short-stat .stat-icon {
            font-size: 0.8rem;
        }

        .short-open {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            color: var(--yt-red);
            text-decoration: none;
            transition: all 0.2s;
            background: var(--bg3);
        }
        .short-open:hover {
            border-color: var(--yt-red);
            background: var(--bg2);
        }

        .state-box {
            padding: 22px 16px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text3);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .state-retry {
            margin-top: 10px;
            font-size: 0.74rem;
            padding: 5px 14px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
        }
        .state-retry:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-box {
            padding: 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text3);
        }

        .summary-bar {
            font-size: 0.78rem;
            color: var(--text3);
            margin-bottom: 20px;
        }

        .channel-section,
        .short-row {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.4s ease forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 560px) {
            .page-wrap {
                padding: 14px 12px 70px;
            }
            .short-thumb-wrap {
                width: 52px;
                height: 92px;
            }
            .short-title {
                font-size: 0.8rem;
            }
            .toolbar-btn {
                font-size: 0.76rem;
                padding: 7px 11px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <span class="nav-title">Shorts Tracker</span>
        <span class="nav-x-icon" style="font-size:0.75rem;color:var(--text3);">via RSS</span>
        <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
            <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        </div>
    </nav>

    <div class="page-wrap">

        <div class="toolbar">
            <div class="toolbar-info">
                <div class="toolbar-title">Shorts — last 7 days</div>
                <div class="toolbar-subtitle" id="toolbarSubtitle">Loading…</div>
                <div class="toolbar-subtitle" id="toolbarPeriod"></div>
            </div>
            <button class="toolbar-btn" id="refreshBtn">↺ Refresh</button>
            <button class="toolbar-btn primary" id="downloadBtn" disabled>⬇ Download Sheet</button>
        </div>

        <div id="channelsContainer"></div>

    </div>

    
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shorts Tracker — MediaTools Studio</title>
    <link rel="preconnect" href="https://api.allorigins.win">
    <link rel="preconnect" href="https://corsproxy.io">
    <link rel="preconnect" href="https://api.codetabs.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script>
        (function() {
            var STORAGE_KEY = "mts-theme";
            var theme = localStorage.getItem(STORAGE_KEY);
            if (!theme) {
                theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="../assets/global.css">
    <style>
        :root {
            --yt-red: #ff0000;
        }
        [data-theme="light"] {
            --yt-red: #cc0000;
        }

        .page-wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .toolbar-info {
            flex: 1;
            min-width: 200px;
        }
        .toolbar-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }
        .toolbar-subtitle {
            font-size: 0.8rem;
            color: var(--text3);
            margin-top: 2px;
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 14px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .toolbar-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .toolbar-btn:disabled:hover {
            border-color: var(--border2);
            color: var(--text2);
        }
        .toolbar-btn.primary {
            background: var(--yt-red);
            color: #fff;
            border-color: var(--yt-red);
        }
        .toolbar-btn.primary:hover {
            opacity: 0.88;
            color: #fff;
        }

        .channel-section {
            margin-bottom: 26px;
        }
        .channel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .channel-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .channel-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .channel-handle {
            font-size: 0.75rem;
            color: var(--text3);
        }
        .channel-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text2);
            background: var(--bg3);
            padding: 2px 9px;
            border-radius: 100px;
        }
        .channel-warning {
            font-size: 0.72rem;
            color: var(--accent3, #ff6b6b);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .shorts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .short-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
            transition: background 0.2s, border-color 0.2s;
        }
        .short-row:hover {
            background: var(--card-hover);
            border-color: var(--border2);
        }

        .short-thumb-wrap {
            width: 64px;
            height: 114px;
            flex-shrink: 0;
            border-radius: 8px;
            background: var(--bg3);
            overflow: hidden;
            position: relative;
        }
        .short-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .short-info {
            flex: 1;
            min-width: 0;
        }
        .short-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.35;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .short-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .short-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.74rem;
            color: var(--text3);
        }
        .short-stat .stat-icon {
            font-size: 0.8rem;
        }

        .short-open {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            color: var(--yt-red);
            text-decoration: none;
            transition: all 0.2s;
            background: var(--bg3);
        }
        .short-open:hover {
            border-color: var(--yt-red);
            background: var(--bg2);
        }

        .state-box {
            padding: 22px 16px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text3);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .state-retry {
            margin-top: 10px;
            font-size: 0.74rem;
            padding: 5px 14px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-xs);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
        }
        .state-retry:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-box {
            padding: 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text3);
        }

        .summary-bar {
            font-size: 0.78rem;
            color: var(--text3);
            margin-bottom: 20px;
        }

        .channel-section,
        .short-row {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.4s ease forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 560px) {
            .page-wrap {
                padding: 14px 12px 70px;
            }
            .short-thumb-wrap {
                width: 52px;
                height: 92px;
            }
            .short-title {
                font-size: 0.8rem;
            }
            .toolbar-btn {
                font-size: 0.76rem;
                padding: 7px 11px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a class="nav-back" href="../index.html">← Tools</a>
        <span class="nav-title">Shorts Tracker</span>
        <span class="nav-x-icon" style="font-size:0.75rem;color:var(--text3);">via RSS</span>
        <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
            <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        </div>
    </nav>

    <div class="page-wrap">

        <div class="toolbar">
            <div class="toolbar-info">
                <div class="toolbar-title">Shorts — last 7 days</div>
                <div class="toolbar-subtitle" id="toolbarSubtitle">Loading…</div>
            </div>
            <button class="toolbar-btn" id="refreshBtn">↺ Refresh</button>
            <button class="toolbar-btn primary" id="downloadBtn" disabled>⬇ Download Sheet</button>
        </div>

        <div id="channelsContainer"></div>

    </div>

    <script src="../assets/theme.js"></script>
    <script>
        // ═══════════════════════════════════════════
        //  PROXIES
        // ═══════════════════════════════════════════
        const PROXIES = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        ];

        async function fetchWithProxy(url, timeoutMs = 7000) {
            for (const proxyFn of PROXIES) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), timeoutMs);
                    const res = await fetch(proxyFn(url), { cache: 'no-store', signal: controller.signal });
                    clearTimeout(timeout);
                    if (res.ok) return res.text();
                } catch (e) {}
            }
            throw new Error('All proxies failed');
        }

        // ═══════════════════════════════════════════
        //  CHANNELS
        // ═══════════════════════════════════════════
        const CHANNELS = [
            { key: 'le360', label: 'Le360', handle: '@le360.', channelId: 'UCGYE6-D0--78oXa4wDiOk6g', color: '#ff0000' },
            { key: 'le360sport', label: 'Le360 Sport', handle: '@le360sport', channelId: 'UCbTsf-3-y9ULwMYF0qB8z6A',
            color: '#22c55e' },
            { key: 'le360afrique', label: 'Le360 Afrique', handle: '@le360afrique', channelId: 'UChDA3N9lr2b3gvCfGUA6MYg',
                color: '#f59e0b' },
            { key: 'le360news', label: 'Le360 News', handle: '@le360news', channelId: 'UCN0qLWVjj_T_c2jPro25PBQ',
                color: '#3b82f6' },
        ];

        const DAYS = 7;
        const CUTOFF_MS = DAYS * 24 * 60 * 60 * 1000;

        let allResults = {}; // key -> array of rows

        // ═══════════════════════════════════════════
        //  DATA FETCHING — RSS only, filter by /shorts/ link
        // ═══════════════════════════════════════════

        async function fetchRSSVideos(col) {
            const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${col.channelId}`;
            const text = await fetchWithProxy(feedUrl);
            const xml = new DOMParser().parseFromString(text, 'application/xml');
            if (xml.querySelector('parsererror')) throw new Error('Invalid XML response');

            const entries = xml.querySelectorAll('entry');
            const out = [];
            entries.forEach(entry => {
                const videoId = entry.getElementsByTagNameNS('http://www.youtube.com/xml/schemas/2015', 'videoId')[0]
                    ?.textContent;
                if (!videoId) return;
                const title = entry.querySelector('title')?.textContent || '';
                // Prefer the RSS link; if it contains "/shorts/" we keep it, else we drop it later.
                const link = entry.querySelector('link[rel="alternate"]')?.getAttribute('href') ||
                    `https://www.youtube.com/shorts/${videoId}`;
                const published = entry.querySelector('published')?.textContent || '';
                const mediaGroup = entry.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'group')[0];
                const communityStats = mediaGroup?.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'community')[
                0];
                const statistics = communityStats?.getElementsByTagNameNS('http://search.yahoo.com/mrss/',
                    'statistics')[0];
                const views = parseInt(statistics?.getAttribute('views') || '0', 10);
                out.push({ videoId, title, link, published, views });
            });
            return out;
        }

        // ═══════════════════════════════════════════
        //  LOAD CHANNEL — filter by /shorts/ in link
        // ═══════════════════════════════════════════

        async function loadChannel(col) {
            const videos = await fetchRSSVideos(col);

            const now = Date.now();
            const withinWindow = videos.filter(v =>
                v.published && (now - new Date(v.published).getTime()) <= CUTOFF_MS
            );

            // ─── KEY CHANGE: only keep videos whose link contains "/shorts/" ───
            // This replaces the old shorts‑page scraping + fallback warning.
            const filtered = withinWindow.filter(v =>
                v.link && v.link.includes('/shorts/')
            );

            const rows = filtered
                .sort((a, b) => new Date(b.published) - new Date(a.published))
                .map(v => ({ ...v, channelKey: col.key, channelLabel: col.label }));

            return { rows };
        }

        // ═══════════════════════════════════════════
        //  FORMATTING
        // ═══════════════════════════════════════════
        function formatDate(ds) {
            if (!ds) return '';
            try {
                const d = new Date(ds);
                const now = new Date();
                const diff = (now - d) / 1000;
                if (diff < 60) return 'Just now';
                if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
                if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
                if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
                return d.toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) { return ds; }
        }

        function formatCount(n) {
            if (!n || n === 0) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
            return n.toString();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ═══════════════════════════════════════════
        //  RENDERING
        // ═══════════════════════════════════════════
        const container = document.getElementById('channelsContainer');

        function buildChannelSection(col) {
            const section = document.createElement('div');
            section.className = 'channel-section';
            section.id = `section-${col.key}`;
            section.innerHTML = `
            <div class="channel-head">
              <span class="channel-dot" style="background:${col.color}"></span>
              <span class="channel-name">${col.label}</span>
              <span class="channel-handle">${col.handle}</span>
              <span class="channel-count" id="count-${col.key}">…</span>
            </div>
            <div id="body-${col.key}">
              <div class="state-box">Loading last ${DAYS} days of shorts…</div>
            </div>`;
            return section;
        }

        function renderShortRow(row) {
            const el = document.createElement('div');
            el.className = 'short-row';
            const videoUrl = row.link || `https://www.youtube.com/shorts/${row.videoId}`;
            el.innerHTML = `
            <div class="short-thumb-wrap">
              <img class="short-thumb" src="https://i.ytimg.com/vi/${row.videoId}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display='none'">
            </div>
            <div class="short-info">
              <div class="short-title">${escapeHtml(row.title)}</div>
              <div class="short-meta">
                <span class="short-stat"><span class="stat-icon">👁</span><span>${formatCount(row.views)} views</span></span>
                <span class="short-stat"><span class="stat-icon">🕐</span><span>${formatDate(row.published)}</span></span>
              </div>
            </div>
            <a class="short-open" href="${videoUrl}" target="_blank" rel="noopener">Open ↗</a>`;
            return el;
        }

        function renderChannelBody(col, rows) {
            const body = document.getElementById(`body-${col.key}`);
            const count = document.getElementById(`count-${col.key}`);
            count.textContent = `${rows.length} short${rows.length === 1 ? '' : 's'}`;
            body.innerHTML = '';

            if (!rows.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-box';
                empty.textContent = `No shorts published in the last ${DAYS} days.`;
                body.appendChild(empty);
                return;
            }

            const list = document.createElement('div');
            list.className = 'shorts-list';
            rows.forEach(row => list.appendChild(renderShortRow(row)));
            body.appendChild(list);
        }

        function renderChannelError(col, err) {
            const body = document.getElementById(`body-${col.key}`);
            const count = document.getElementById(`count-${col.key}`);
            count.textContent = 'error';
            body.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'state-box';
            box.innerHTML = `⚠ Failed to load this channel.`;
            const btn = document.createElement('button');
            btn.className = 'state-retry';
            btn.textContent = '↺ Retry';
            btn.onclick = () => loadAndRenderChannel(col);
            box.appendChild(document.createElement('br'));
            box.appendChild(btn);
            body.appendChild(box);
            console.warn('Shorts fetch error', col.key, err);
        }

        function updateSummary() {
            const total = Object.values(allResults).reduce((sum, r) => sum + (r ? r.length : 0), 0);
            const loadedChannels = Object.keys(allResults).length;
            const subtitle = document.getElementById('toolbarSubtitle');
            subtitle.textContent =
                `${total} short${total === 1 ? '' : 's'} across ${loadedChannels}/${CHANNELS.length} channels · last ${DAYS} days`;
            document.getElementById('downloadBtn').disabled = total === 0;
        }

        async function loadAndRenderChannel(col) {
            const body = document.getElementById(`body-${col.key}`);
            const count = document.getElementById(`count-${col.key}`);
            count.textContent = '…';
            body.innerHTML = `<div class="state-box">Loading last ${DAYS} days of shorts…</div>`;
            delete allResults[col.key];
            updateSummary();

            try {
                const { rows } = await loadChannel(col);
                allResults[col.key] = rows;
                renderChannelBody(col, rows);
            } catch (err) {
                renderChannelError(col, err);
            }
            updateSummary();
        }

        function loadAll() {
            container.innerHTML = '';
            allResults = {};
            CHANNELS.forEach((col, i) => {
                container.appendChild(buildChannelSection(col));
            });
            updateSummary();
            CHANNELS.forEach((col, i) => {
                setTimeout(() => loadAndRenderChannel(col), i * 120);
            });
        }

        // ═══════════════════════════════════════════
        //  CSV EXPORT
        // ═══════════════════════════════════════════
        function csvEscape(val) {
            const s = String(val ?? '');
            if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
            return s;
        }

        function buildCsv() {
            const rows = Object.values(allResults).flat().sort((a, b) => new Date(b.published) - new Date(a.published));
            const header = ['Channel', 'Title', 'Views', 'Published Date', 'Link'];
            const lines = [header.map(csvEscape).join(',')];
            rows.forEach(r => {
                const dateIso = r.published ? new Date(r.published).toISOString().slice(0, 16).replace('T', ' ') : '';
                const link = r.link || `https://www.youtube.com/shorts/${r.videoId}`;
                lines.push([r.channelLabel, r.title, r.views, dateIso, link].map(csvEscape).join(','));
            });
            return '\uFEFF' + lines.join('\r\n');
        }

        function downloadCsv() {
            const csv = buildCsv();
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const today = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `le360-shorts-${today}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        document.getElementById('downloadBtn').addEventListener('click', downloadCsv);
        document.getElementById('refreshBtn').addEventListener('click', loadAll);

        loadAll();
    </script>
</body>
</html>

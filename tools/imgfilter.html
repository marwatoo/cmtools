<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Filters — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <style>
    
    
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
    .nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
    .nav-back{display:flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-size:.85rem;font-weight:500;padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius-xs);transition:all .2s}
    .nav-back:hover{color:var(--text);border-color:var(--accent)}
    .nav-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;flex:1}

    .tool-page{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
    .tool-header{margin-bottom:28px}
    .tool-header h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;letter-spacing:-.02em;margin-bottom:6px}
    .tool-header p{color:var(--text2);font-size:.9rem}


    /* Drop zone */
    .dropzone{border:2px dashed var(--border2);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2);position:relative}
    .dropzone:hover,.dropzone.drag-over{border-color:var(--accent);background:var(--card-hover)}
    .dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .dz-icon{font-size:2.4rem;margin-bottom:10px;opacity:.5}
    .dz-text{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px}
    .dz-sub{font-size:.8rem;color:var(--text3)}

    /* Workspace */
    .workspace{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:24px}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}}

    /* Canvas area */
    .canvas-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;justify-content:center;min-height:400px;position:relative;overflow:hidden}
    .canvas-wrap canvas{max-width:100%;max-height:500px;object-fit:contain;border-radius:var(--radius-sm)}
    .canvas-placeholder{color:var(--text3);font-size:.9rem}

    /* Controls */
    .controls{display:flex;flex-direction:column;gap:16px}
    .control-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .control-card h3{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;margin-bottom:14px}

    .srow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .srow:last-child{margin-bottom:0}
    .srow label{font-size:.78rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);white-space:nowrap;width:80px;flex-shrink:0}
    .sval{width:44px;flex-shrink:0;text-align:right;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--text3)}
    input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:100px;background:var(--border2);outline:none;cursor:pointer}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}

    /* Presets */
    .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .preset-btn{padding:10px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.75rem;color:var(--text2);text-align:center;transition:all .15s}
    .preset-btn:hover{border-color:var(--accent);color:var(--text);background:var(--card-hover)}
    .preset-btn.active{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}

    /* Buttons */
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;transition:all .2s;width:100%;margin-bottom:10px}
    .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    .btn-row{display:flex;gap:10px}.btn-row .btn{margin-bottom:0}

    /* Compare */
    .compare-toggle{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text2);cursor:pointer;margin-top:8px}
    .compare-toggle input{accent-color:var(--accent)}

    .tool-header, .dropzone, .workspace {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .dropzone { animation-delay: 0.1s; }
    .workspace { animation-delay: 0.2s; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-title">Image Filters</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header">
      <h1>Image Filters &amp; Adjustments</h1>
      <p>Adjust brightness, contrast, saturation and apply filters to your images. Export as PNG or JPG.</p>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="dz-icon">🖼</div>
      <div class="dz-text">Drop image here or click to upload</div>
      <div class="dz-sub">Supports JPG, PNG, WebP — Max 10MB</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="workspace" id="workspace" style="display:none">
      <!-- Canvas preview -->
      <div class="canvas-wrap">
        <canvas id="previewCanvas"></canvas>
        <span class="canvas-placeholder" id="placeholder" style="display:none">Load an image to start</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <!-- Adjustments -->
        <div class="control-card">
          <h3>Adjustments</h3>
          <div class="srow">
            <label>Brightness</label>
            <input type="range" id="brightness" min="0" max="200" value="100">
            <span class="sval" id="brightnessVal">100</span>
          </div>
          <div class="srow">
            <label>Contrast</label>
            <input type="range" id="contrast" min="0" max="200" value="100">
            <span class="sval" id="contrastVal">100</span>
          </div>
          <div class="srow">
            <label>Saturation</label>
            <input type="range" id="saturate" min="0" max="200" value="100">
            <span class="sval" id="saturateVal">100</span>
          </div>
          <div class="srow">
            <label>Blur</label>
            <input type="range" id="blur" min="0" max="20" value="0">
            <span class="sval" id="blurVal">0</span>
          </div>
          <div class="srow">
            <label>Hue Rotate</label>
            <input type="range" id="hue" min="0" max="360" value="0">
            <span class="sval" id="hueVal">0</span>
          </div>
          <div class="srow">
            <label>Opacity</label>
            <input type="range" id="opacity" min="0" max="100" value="100">
            <span class="sval" id="opacityVal">100</span>
          </div>
          <div class="srow">
            <label>Invert</label>
            <input type="range" id="invert" min="0" max="100" value="0">
            <span class="sval" id="invertVal">0</span>
          </div>
          <div class="srow">
            <label>Vibrance</label>
            <input type="range" id="vibrance" min="0" max="200" value="100">
            <span class="sval" id="vibranceVal">100</span>
          </div>
        </div>

        <!-- Presets -->
        <div class="control-card">
          <h3>Filter Presets</h3>
          <div class="preset-grid">
            <button class="preset-btn" data-preset="none">None</button>
            <button class="preset-btn" data-preset="vintage">Vintage</button>
            <button class="preset-btn" data-preset="bw">B&W</button>
            <button class="preset-btn" data-preset="sepia">Sepia</button>
            <button class="preset-btn" data-preset="invert">Invert</button>
            <button class="preset-btn" data-preset="cool">Cool</button>
            <button class="preset-btn" data-preset="warm">Warm</button>
            <button class="preset-btn" data-preset="dramatic">Dramatic</button>
            <button class="preset-btn" data-preset="fade">Fade</button>
          </div>
        </div>

        <!-- Export -->
        <div class="control-card">
          <h3>Export</h3>
          <div class="btn-row">
            <button class="btn btn-primary" id="exportPNG">Export PNG</button>
            <button class="btn btn-secondary" id="exportJPG">Export JPG</button>
          </div>
          <button class="btn btn-secondary" id="resetBtn" style="margin-top:8px">Reset All</button>
        </div>

        <!-- Compare -->
        <div class="compare-toggle">
          <input type="checkbox" id="compareToggle">
          <label for="compareToggle">Show original on hover</label>
        </div>
      </div>
    </div>
  </div>

  
  
</body>
</html>

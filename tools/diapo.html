<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diapo Overlay — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    .file-list { list-style:none; margin:12px 0 20px; }
    .file-list li {
      display:flex; align-items:center; justify-content:space-between;
      font-size:0.82rem; color:var(--text2); padding:8px 12px;
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:var(--radius-xs); margin-bottom:6px;
    }
    .file-list li.done { color:var(--accent); border-color:var(--accent); }
    .file-list li.processing { color:var(--accent2); }
    .progress-bar {
      height:3px; background:var(--border); border-radius:10px; margin:12px 0 20px; overflow:hidden;
    }
    .progress-fill {
      height:100%; background:var(--accent); transition:width 0.3s; width:0%;
    }
    canvas { display:none; }

    .tool-header, .file-list, .progress-bar, .mode-tabs, .btn {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .tool-header { animation-delay: 0.05s; }
    .file-list { animation-delay: 0.1s; }
    .progress-bar { animation-delay: 0.15s; }
    .mode-tabs { animation-delay: 0.2s; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">Diapo Overlay</span>

    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header">
      <h1>Diapo Overlay</h1>
      <p>Batch-process images to 1080×1350 portrait format with logo overlay. Auto-downloads each file.</p>
    </div>

    <label class="upload-zone" id="uploadZone" for="uploadInput">
      <div class="upload-icon">◧</div>
      <div class="upload-text">Choose one or more images<br><span style="font-size:0.8rem;color:var(--text3);">Multiple selection supported</span></div>
      <input type="file" id="uploadInput" accept="image/*" multiple />
    </label>

    <ul class="file-list" id="fileList"></ul>
    <div class="progress-bar" id="progressBar" style="display:none;">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="btn btn-primary" id="processBtn" disabled>◧ Generate & Download Images</button>
    <div id="doneMsg" style="display:none;margin-top:12px;text-align:center;font-size:0.9rem;color:var(--accent);">
      ✓ Done! All images downloaded.
    </div>

    <canvas id="canvas" width="1080" height="1350"></canvas>
  </div>

  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le360 Deck — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    .deck-container {
      opacity: 0; transform: translateY(12px);
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    /* RTL modal */
    .modal-box.rtl { direction: rtl; text-align: right; }
    .modal-box.rtl .modal-close { right: auto; left: 16px; }
    .modal-box.rtl h2 { padding-right: 0; padding-left: 40px; }
    .modal-box.rtl .slider-prev { left: auto; right: 10px; }
    .modal-box.rtl .slider-next { right: auto; left: 10px; }

    /* RTL columns */
    .deck-column.rtl .deck-card h3 { text-align: right; direction: rtl; }
    .deck-column.rtl .deck-card-date { text-align: right; direction: rtl; }

    /* Refresh indicator */
    .deck-col-header { position: relative; }
    .deck-refresh-status {
      font-size: 0.62rem;
      color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      margin-left: auto;
      opacity: 0.7;
      white-space: nowrap;
    }
    .deck-refresh-status.refreshing { color: var(--accent); opacity: 1; }
    .deck-refresh-status.error { color: #e05; opacity: 1; }

    /* ════════════════════════════════════════
       MOBILE — TAB-BASED SINGLE COLUMN VIEW
    ════════════════════════════════════════ */

    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: var(--bg2);
      border-top: 1px solid var(--border2);
      z-index: 90;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      align-items: stretch;
    }
    .mobile-tab-bar::-webkit-scrollbar { display: none; }

    .mobile-tab {
      flex: 0 0 auto;
      min-width: 72px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; padding: 5px 10px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .mobile-tab:hover { background: var(--bg3); }
    .mobile-tab.active { border-bottom-color: var(--accent); }

    .mobile-tab-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--bg3); border: 1.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.58rem; color: var(--accent2);
      transition: border-color 0.15s, color 0.15s;
    }
    .mobile-tab.active .mobile-tab-dot { border-color: var(--accent); color: var(--accent); }

    .mobile-tab-label {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.5rem; color: var(--text3);
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 72px;
      transition: color 0.15s;
    }
    .mobile-tab.active .mobile-tab-label { color: var(--accent); }

    @keyframes slideInFromRight { from { transform: translateX(28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    @keyframes slideInFromLeft  { from { transform: translateX(-28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    .deck-column.slide-from-right { animation: slideInFromRight 0.22s cubic-bezier(0.4,0,0.2,1) forwards; }
    .deck-column.slide-from-left  { animation: slideInFromLeft  0.22s cubic-bezier(0.4,0,0.2,1) forwards; }

    @media (max-width: 700px) {
      .deck-column {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .nav { padding: 10px 14px; gap: 8px; }
      .nav-back { padding: 5px 9px; font-size: 0.78rem; }
      .nav-title { font-size: 0.88rem; }
      .nav-num { display: none; }
      .theme-toggle { width: 32px; height: 32px; }

      .mobile-tab-bar { display: flex; }

      .deck-container {
        display: block;
        height: calc(100vh - 53px);
        overflow: hidden;
        position: relative;
      }
      .deck-column {
        position: absolute; inset: 0;
        min-width: unset !important; max-width: unset !important;
        width: 100%; border-right: none;
        display: none; flex-direction: column;
        padding-bottom: 52px;
      }
      .deck-column.mobile-active { display: flex; }
      .deck-col-feed { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

      .deck-card { padding: 10px; }
      .deck-card-img { aspect-ratio: 16/9; }
      .deck-btn { font-size: 0.64rem; padding: 3px 7px; }

      .modal-overlay { padding: 0 !important; align-items: flex-end !important; }
      .modal-box {
        max-width: 100% !important; width: 100% !important;
        max-height: 92vh !important;
        border-radius: var(--radius) var(--radius) 0 0 !important;
        padding: 20px 16px 28px !important;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">Le360 Deck</span>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
      <a href="snippets.html" style="font-size:0.78rem;color:var(--text2);text-decoration:none;padding:5px 10px;border:1px solid var(--border2);border-radius:6px;">⌨ Snippets</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme" style="margin-left:0;"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    </div>
  </nav>

  <div class="deck-container" id="deckContainer"></div>
  <div class="mobile-tab-bar" id="mobileTabBar"></div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody">Loading…</div>
    </div>
  </div>

  
</body>
</html>

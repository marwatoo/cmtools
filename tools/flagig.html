<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG Flag Post — MediaTools Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    /* ── page-specific only ─────────────────────────────────────────────── */

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
      overflow: visible;
      position: relative;
      z-index: 10;
    }
    .controls-grid, .search-row, .field, .btn, .flag-preview {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .controls-grid { animation-delay: 0.05s; }
    .search-row:nth-of-type(1) { animation-delay: 0.1s; }
    .search-row:nth-of-type(2) { animation-delay: 0.15s; }
    .field:nth-of-type(1) { animation-delay: 0.2s; }
    .field:nth-of-type(2) { animation-delay: 0.25s; }
    .btn { animation-delay: 0.3s; }

    @media (max-width: 560px) {
      .controls-grid { grid-template-columns: 1fr; }
      .divider-col   { display: none; }
    }

    /* ── flag col ───────────────────────────────────────────────────────── */
    .flag-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .divider-col {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 14px;
      font-size: 1.4rem;
      color: var(--text3);
      user-select: none;
    }

    /* ── search row (input + button) ────────────────────────────────────── */
    .search-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .flag-search-wrap {
      position: relative;
      flex: 1;
    }

    .flag-search-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: var(--input-bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .flag-search-wrap input::placeholder { color: var(--text3); }
    .flag-search-wrap input:focus {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .btn-search {
      flex-shrink: 0;
      height: 44px;
      padding: 0 16px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-search:hover   { opacity: 0.88; transform: translateY(-1px); }
    .btn-search:active  { transform: translateY(0); }
    .btn-search:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── suggestions dropdown ───────────────────────────────────────────── */
    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      min-width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 9999;
      overflow: hidden;
      animation: fadeUp 0.18s ease forwards;
      opacity: 0;
      transform: translateY(6px);
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover {
      background: var(--card-hover);
    }
    .suggestion-item:hover span {
      color: var(--accent);
    }

    .suggestion-item img {
      width: 48px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg3);
    }

    .suggestion-item span {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      transition: color 0.15s;
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    /* ── flag preview card ──────────────────────────────────────────────── */
    .flag-preview {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg3);
      border: 1px dashed var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text3);
      font-size: 0.85rem;
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }

    .flag-preview.loaded {
      border-style: solid;
      border-color: var(--border2);
      background: #000;
      padding: 0;
      position: relative;
    }

    .flag-preview.loaded img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .flag-preview.loaded span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.03em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── logo offset row ────────────────────────────────────────────────── */
    .logo-row {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    .logo-row .field input {
      width: 120px;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .logo-row .field input:focus { border-color: var(--accent); }
    .logo-row .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .logo-color-toggle {
      display: flex;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .logo-color-btn {
      flex: 1;
      padding: 10px 18px;
      border: none;
      background: var(--input-bg);
      color: var(--text2);
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .logo-color-btn:first-child { border-right: 1px solid var(--border2); }
    .logo-color-btn.active {
      background: var(--btn-bg);
      color: var(--btn-text);
    }
    .logo-color-btn:not(.active):hover {
      background: var(--card-hover);
      color: var(--text);
    }

    /* ── field label (shared) ───────────────────────────────────────────── */
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── status notice ──────────────────────────────────────────────────── */
    .notice {
      padding: 12px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      color: var(--text2);
      margin-bottom: 16px;
      transition: border-color 0.2s, color 0.2s;
    }

    /* ── bottom row (download btn + status) ─────────────────────────────── */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      position: relative;
      z-index: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-text);
    }
    .btn-primary:hover:not(:disabled)  { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.32; cursor: not-allowed; transform: none; }

    .status {
      font-size: 0.8rem;
      color: var(--text2);
    }

    /* ── canvas wrap ────────────────────────────────────────────────────── */
    .canvas-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
    }
    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">IG Flag Post</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-page">

    <div class="tool-header">
      <h1>IG Flag Post</h1>
      <p>Two flags stacked top/bottom — exports 1080×1350 PNG with le360 logo overlay.</p>
    </div>

    <div class="controls-grid">

      <div class="flag-col">
        <div class="field">
          <label>Top flag</label>
          <div class="search-row">
            <div class="flag-search-wrap" id="wrapT">
              <input type="text" id="inputT" placeholder="Morocco, France, Brazil…" autocomplete="off" />
              <div class="suggestions" id="sugT" style="display:none;"></div>
            </div>
            <button class="btn-search" id="btnT">Search</button>
          </div>
        </div>
      </div>

      <div class="divider-col">⇅</div>

      <div class="flag-col">
        <div class="field">
          <label>Bottom flag</label>
          <div class="search-row">
            <div class="flag-search-wrap" id="wrapB">
              <input type="text" id="inputB" placeholder="Honduras, Germany, Japan…" autocomplete="off" />
              <div class="suggestions" id="sugB" style="display:none;"></div>
            </div>
            <button class="btn-search" id="btnB">Search</button>
          </div>
        </div>
      </div>

    </div>

    <div class="logo-row">
      <div class="field">
        <label>Logo Y offset (%)</label>
        <input type="number" id="logoY" value="0" min="-50" max="50" step="1" />
      </div>
      <div class="field">
        <label>Logo color</label>
        <div class="logo-color-toggle">
          <button class="logo-color-btn active" id="logoWhite" data-color="white">White</button>
          <button class="logo-color-btn" id="logoBlack" data-color="black">Black</button>
        </div>
      </div>
    </div>

    <div class="notice" id="statusNotice">
      Search and select two flags to generate the image.
    </div>

    <div class="bottom-row">
      <button class="btn btn-primary" id="dlBtn" disabled>↓ Download 1080×1350 PNG</button>
      <span class="status" id="status"></span>
    </div>

    <div class="canvas-wrap">
      <canvas id="cv" width="1080" height="1350"></canvas>
    </div>

  </div>

  
</body>
</html>

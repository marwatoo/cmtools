<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Post Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/global.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    .page-header {
      padding: 24px 24px 20px;
      max-width: 620px;
      margin: 0 auto;
    }
    .page-header h1 { margin: 0 0 4px; }
    .page-header p { margin: 0; }

    .tool-page {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .controls-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
    }

    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 20px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .preview-canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .url-field {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .url-field .field {
      flex: 1;
      margin: 0;
    }
    .url-field .btn {
      flex-shrink: 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text2);
    }
    .status-row.success { border-color: #00ba7c; color: #00ba7c; }
    .status-row.error   { border-color: #f4212e; color: #f4212e; }
    .status-row.loading { border-color: var(--accent); color: var(--accent); }

    .format-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 12px;
    }
    .format-tab {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: calc(var(--radius-sm) - 2px);
      transition: background .18s, color .18s;
    }
    .format-tab:hover  { color: var(--text); background: var(--bg2); }
    .format-tab.active { background: var(--btn-bg); color: var(--btn-text); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text2);
      cursor: pointer;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .tool-header, .controls-card, .preview-wrap {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    .tool-header   { animation-delay: 0.05s; }
    .controls-card { animation-delay: 0.1s; }
    .preview-wrap  { animation-delay: 0.15s; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-title">X Post Image</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>

  <div class="tool-page">

    <div class="page-header">
      <div class="tool-header" style="margin-bottom:18px;">
        <h1>X Post Image</h1>
        <p>Generate a shareable post card image from any X/tweet link.</p>
      </div>
    </div>

    <div class="controls-card">

      <p class="section-head">Tweet URL</p>

      <div class="url-field">
        <div class="field">
          <input type="text" id="tweetUrl" placeholder="https://x.com/user/status/123456789">
        </div>
        <button class="btn btn-primary" id="fetchBtn" style="margin:0;width:auto;padding:12px 24px;">Generate</button>
      </div>

      <div class="status-row" id="statusRow">
        Paste an X/tweet link and click Generate to create the post image.
      </div>

      <p class="section-head">Theme</p>

      <div class="format-tabs" id="bgTabs">
        <button class="format-tab active" data-bg="#000000">Dark</button>
        <button class="format-tab" data-bg="#ffffff">Light</button>
      </div>

      <label class="checkbox-row" style="margin-top:12px;">
        <input type="checkbox" id="showLogo" checked>
        <span>Show X logo</span>
      </label>

    </div>

    <div class="preview-wrap">
      <canvas id="canvas" class="preview-canvas"></canvas>
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="dlBtn" disabled style="flex:1;">Download Image</button>
      <button class="btn btn-primary" id="dlBtn1350" disabled style="flex:1;">Save 1080 × 1350</button>
    </div>

  </div>

  
</body>
</html>
